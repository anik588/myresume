<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solar Orbit Skill Icons</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
  <style>
    #page-wrapper {

      width: 100%;
      height: 80vh;
  overflow: visible;
      background-color: black;
    }


    #3d-container {

      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .orbit-icon {
      border-radius: 50%;
      background-color: white;
      object-fit: contain;
      pointer-events: none;
      transition: transform 0.2s ease;
    }

    /* Responsive styling */
    @media (max-width: 768px) {
    #3d-container {
        height: 80vh;
      }
      .orbit-icon {
        width: 40px;
        height: 40px;
        padding: 3px;
      }
    }

    @media (max-width: 480px) {
      #page-wrapper {
        height: 55vh;
      }
      .orbit-icon {
        width: 32px;
        height: 32px;
        padding: 2px;
      }
    }


  </style>
</head>
<body>

<div id="page-wrapper">
  <div id="3d-container"></div>
</div>
<script>
  const container = document.getElementById('3d-container');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  // OrbitControls
  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  controls.minPolarAngle = Math.PI / 4;  // Lower limit (e.g., 45°)
  controls.maxPolarAngle = Math.PI / 1.7;  // Upper limit (e.g., ~106°)

  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.rotateSpeed = 0.4;
  controls.zoomSpeed = 0.6;
  controls.enableZoom = true;
  controls.enableRotate = true;
  controls.enablePan = false;
  controls.enableTouchRotate = true;
  controls.enableTouchZoom = true;
  controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY };
controls.minDistance = 3; // how close the camera can get
controls.maxDistance = 10; // how far the camera can go

  // Responsive camera positioning
  if (window.innerWidth < 768) {
    camera.position.z = 8;
  } else {
    camera.position.z = 10;
  }

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
  scene.add(ambientLight);
  const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
  directionalLight.position.set(5, 5, 5);
  scene.add(directionalLight);

  // Stars
  const starGeo = new THREE.SphereGeometry(0.1, 8, 8);
  const starMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const stars = [];
  for (let i = 0; i < 5000; i++) {
    const star = new THREE.Mesh(starGeo, starMat);
    star.position.set(Math.random() * 600 - 300, Math.random() * 600 - 300, Math.random() * 600 - 300);
    stars.push(star);
    scene.add(star);
  }

  // Load Sun Model
  let moonModel;
  const loader = new THREE.GLTFLoader();
  loader.load("{% static 'models/scene.gltf' %}", function (gltf) {
    moonModel = gltf.scene;
    moonModel.scale.set(0.35, 0.35, 0.35);
    scene.add(moonModel);
  });

  // Orbiting skill sprites
  const textureLoader = new THREE.TextureLoader();
  const skills = [
    { name: 'react', src: '{% static "img/skills/react.png" %}', radius: 3.5, speed: 0.0025 },
    { name: 'nextjs', src: '{% static "img/skills/next-js.png" %}', radius: 4.5, speed: 0.0018 },
    { name: 'threejs', src: '{% static "img/skills/three-js.png" %}', radius: 5.5, speed: 0.0013 },
    { name: 'django', src: '{% static "img/skills/django.png" %}', radius: 6.8, speed: 0.001 },
    { name: 'postgresql', src: '{% static "img/skills/postgres-sql.png" %}', radius: 8, speed: 0.0008 }
  ];

  const orbitSprites = [];
  skills.forEach(skill => {
    textureLoader.load(skill.src, (texture) => {
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(0.8, 0.8, 0.8);
      sprite.userData = {
        angle: Math.random() * Math.PI * 2,
        radius: window.innerWidth < 768 ? skill.radius * 0.75 : skill.radius,
        speed: skill.speed,
        heightOffset: Math.sin(skill.radius) * 0.3 * (Math.random() > 0.5 ? 1 : -1)
      };
      sprite.name = skill.name;
      scene.add(sprite);
      orbitSprites.push(sprite);
    });
  });

  function animate() {
    requestAnimationFrame(animate);
    if (moonModel) moonModel.rotation.y += 0.002;

    scene.rotation.y += 0.0005; // slowly rotate everything including stars

    controls.update();
    const t = Date.now() * 0.001;
    orbitSprites.forEach(sprite => {
      const a = sprite.userData.angle + t * sprite.userData.speed * 100;
      const r = sprite.userData.radius;
      const y = sprite.userData.heightOffset;
      sprite.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
      sprite.lookAt(camera.position);
      const z = sprite.position.z;
      const scale = THREE.MathUtils.clamp(THREE.MathUtils.mapLinear(z, -10, 10, 0.6, 1.3), 0.4, 1.5);
      sprite.scale.set(scale, scale, scale);
      sprite.renderOrder = z > 0 ? 2 : 0;
    });
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });




</script>
</body>
</html>

name: Deploy Django Backend to FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: repositories/myresume/

          # 🔥 add these back
          timeout: 1200000
          log-level: verbose
          dangerous-clean-slate: false

          exclude: |
            **/.git/**
            **/.git*
            **/__pycache__/**
            **/*.pyc
            **/node_modules/**
            **/venv/**
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solar Orbit Skill Icons</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
  <style>
 #page-wrapper {
  width: 100%;
  height: 100vh; /* Full height section */
  background-color: black;
  overflow: hidden;
  position: relative;
}

#3d-container {
  width: 100%;
  height: 100%;
  touch-action: none;
  position: absolute;
  top: 0;
  left: 0;
  z-index: 1;
}

    .orbit-icon {
      border-radius: 50%;
      background-color: white;
      object-fit: contain;
      pointer-events: none;
      transition: transform 0.2s ease;
    }

    /* Responsive styling */
    @media (max-width: 768px) {
    #3d-container {
        height: 80vh;
      }
      .orbit-icon {
        width: 40px;
        height: 40px;
        padding: 3px;
      }
    }

    @media (max-width: 480px) {
      #page-wrapper {
        height: 70vh;
      }
      .orbit-icon {
        width: 32px;
        height: 32px;
        padding: 2px;
      }
    }


  </style>
</head>
<body>

<div id="page-wrapper">
  <div id="3d-container"></div>
</div>
<script>
  const container = document.getElementById('3d-container');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  // OrbitControls
  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  controls.minPolarAngle = Math.PI / 4;  // Lower limit (e.g., 45°)
  controls.maxPolarAngle = Math.PI / 1.7;  // Upper limit (e.g., ~106°)

  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.rotateSpeed = 0.4;
  controls.zoomSpeed = 0.6;
  controls.enableZoom = true;
  controls.enableRotate = true;
  controls.enablePan = true; // Allow panning
  controls.enableTouchRotate = true; // Enable touch rotate
  controls.enableTouchZoom = true;   // Enable touch zoom (pinch zoom)
  controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY }; // Pinch zoom

  controls.minDistance = 3;  // how close the camera can get
  controls.maxDistance = 10; // how far the camera can go

  // Responsive camera positioning
  if (window.innerWidth < 768) {
    camera.position.z = 8;
  } else {
    camera.position.z = 10;
  }

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
  scene.add(ambientLight);
  const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
  directionalLight.position.set(5, 5, 5);
  scene.add(directionalLight);

  // Stars (for visual effect)
  const starGeo = new THREE.SphereGeometry(0.1, 8, 8);
  const starMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const stars = [];
  for (let i = 0; i < 5000; i++) {
    const star = new THREE.Mesh(starGeo, starMat);
    star.position.set(Math.random() * 600 - 300, Math.random() * 600 - 300, Math.random() * 600 - 300);
    stars.push(star);
    scene.add(star);
  }

  // Load Sun Model (or Moon)
  let moonModel;
  const loader = new THREE.GLTFLoader();
  loader.load("{% static 'models/scene.gltf' %}", function (gltf) {
    moonModel = gltf.scene;
    moonModel.scale.set(0.35, 0.35, 0.35);
    scene.add(moonModel);
  });

  // Orbiting skill sprites (for skill icons around the model)
  const textureLoader = new THREE.TextureLoader();
  const skills = [
    { name: 'react', src: '{% static "img/skills/react.png" %}', radius: 3.5, speed: 0.0025 },
    { name: 'nextjs', src: '{% static "img/skills/next-js.png" %}', radius: 4.5, speed: 0.0018 },
    { name: 'threejs', src: '{% static "img/skills/three-js.png" %}', radius: 5.5, speed: 0.0013 },
    { name: 'django', src: '{% static "img/skills/django.png" %}', radius: 6.8, speed: 0.001 },
    { name: 'postgresql', src: '{% static "img/skills/postgres-sql.png" %}', radius: 8, speed: 0.0008 }
  ];

  const orbitSprites = [];
  skills.forEach(skill => {
    textureLoader.load(skill.src, (texture) => {
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(0.8, 0.8, 0.8);
      sprite.userData = {
        angle: Math.random() * Math.PI * 2,
        radius: window.innerWidth < 768 ? skill.radius * 0.75 : skill.radius,
        speed: skill.speed,
        heightOffset: Math.sin(skill.radius) * 0.3 * (Math.random() > 0.5 ? 1 : -1)
      };
      sprite.name = skill.name;
      scene.add(sprite);
      orbitSprites.push(sprite);
    });
  });

  // Rotation limit tracking
  let modelRotationY = 0;
  const modelRotationLimit = Math.PI / 2;  // Adjust this to your model's top rotation limit

  // Animate function
  function animate() {
    requestAnimationFrame(animate);

    // Stop model rotation once it reaches the limit
    if (moonModel && modelRotationY < modelRotationLimit) {
      moonModel.rotation.y += 0.002;  // Rotate the model
      modelRotationY = moonModel.rotation.y; // Keep track of the model's rotation
    }

    scene.rotation.y += 0.0005; // Slowly rotate everything including stars

    controls.update(); // Update controls (panning, zooming, etc.)
    const t = Date.now() * 0.001;
    orbitSprites.forEach(sprite => {
      const a = sprite.userData.angle + t * sprite.userData.speed * 100;
      const r = sprite.userData.radius;
      const y = sprite.userData.heightOffset;
      sprite.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
      sprite.lookAt(camera.position);
      const z = sprite.position.z;
      const scale = THREE.MathUtils.clamp(THREE.MathUtils.mapLinear(z, -10, 10, 0.6, 1.3), 0.4, 1.5);
      sprite.scale.set(scale, scale, scale);
      sprite.renderOrder = z > 0 ? 2 : 0;
    });

    renderer.render(scene, camera); // Render the scene
  }

  animate();

  // Handle window resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Prevent default behavior for touch scrolls (for mobile)
  container.addEventListener('touchmove', function (event) {
    event.preventDefault(); // Disable default scrolling on touch events
  });

</script>

</body>
</html>

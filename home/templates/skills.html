<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solar Orbit Skill Icons</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
  <style>
 #page-wrapper {
  width: 100%;
  height: 100vh; /* Full height section */
  background-color: black;
  overflow: hidden;
  position: relative;
}

#3d-container {
  width: 100%;
  height: 100%;
  touch-action: none;
  position: absolute;
  top: 0;
  left: 0;
  z-index: 1;
}

    .orbit-icon {
      border-radius: 50%;
      background-color: white;
      object-fit: contain;
      pointer-events: none;
      transition: transform 0.2s ease;
    }

    /* Responsive styling */
    @media (max-width: 768px) {
    #3d-container {
        height: 80vh;
      }
      .orbit-icon {
        width: 40px;
        height: 40px;
        padding: 3px;
      }
    }

    @media (max-width: 480px) {
      #page-wrapper {
        height: 70vh;
      }
      .orbit-icon {
        width: 32px;
        height: 32px;
        padding: 2px;
      }
    }


  </style>
</head>
<body>

<div id="page-wrapper">
  <div id="3d-container"></div>
</div>
<script>
const container = document.getElementById('3d-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

// Controls (wider view)
const controls = new THREE.OrbitControls(camera, renderer.domElement);
camera.position.set(0, 6, 25);
controls.update();

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const sunLight = new THREE.PointLight(0xffd37a, 2.2, 400);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

// ⭐ Floating stars
const stars = [];
const starGeo = new THREE.SphereGeometry(0.12, 8, 8);
const starMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

for (let i = 0; i < 2500; i++) {
  const star = new THREE.Mesh(starGeo, starMat);

  star.position.set(
    Math.random() * 800 - 400,
    Math.random() * 800 - 400,
    Math.random() * 800 - 400
  );

  star.userData.speed = Math.random() * 0.04 + 0.01;
  stars.push(star);
  scene.add(star);
}

// 🌠 Comets
let comets = [];

function spawnComet() {
  const cometGeo = new THREE.SphereGeometry(0.2, 12, 12);
  const cometMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const comet = new THREE.Mesh(cometGeo, cometMat);

  comet.position.set(
    Math.random() * 80 - 40,
    Math.random() * 20 + 4,
    Math.random() * 80 - 40
  );

  comet.userData.velocity = new THREE.Vector3(
    Math.random() * 0.35 - 0.17,
    -0.09,
    Math.random() * 0.35 - 0.17
  );

  const tailGeo = new THREE.BufferGeometry();
  const tailMat = new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.7, transparent: true });
  const tail = new THREE.Line(tailGeo, tailMat);
  comet.userData.tail = tail;

  scene.add(comet);
  scene.add(tail);
  comets.push(comet);
}

setInterval(spawnComet, Math.random() * 3000 + 5000);

// 🌞 Sun (bigger & flaming)
let sun;

const sunGeo = new THREE.SphereGeometry(4.2, 64, 64);
const sunMat = new THREE.MeshStandardMaterial({
  color: 0xffa500,
  emissive: 0xff4500,
  emissiveIntensity: 2.2,
});

sun = new THREE.Mesh(sunGeo, sunMat);
scene.add(sun);

// Try loading texture (optional)
const textureLoader = new THREE.TextureLoader();
textureLoader.load(
  '/static/models/sun.jpg',
  function (texture) {
    sun.material.map = texture;
    sun.material.needsUpdate = true;
  },
  undefined,
  function () {
    console.warn('sun texture not found, using default material');
  }
);

// Skill models (bigger & noticeable)
const skills = [
  { name: 'react', src: '{% static "img/skills/react.png" %}', radius: 6, speed: 0.0025 },
  { name: 'nextjs', src: '{% static "img/skills/next-js.png" %}', radius: 8, speed: 0.0018 },
  { name: 'threejs', src: '{% static "img/skills/three-js.png" %}', radius: 10, speed: 0.0013 },
  { name: 'django', src: '{% static "img/skills/django.png" %}', radius: 12, speed: 0.001 },
  { name: 'postgresql', src: '{% static "img/skills/postgres-sql.png" %}', radius: 14, speed: 0.0008 },
  { name: 'nodejs', src: '{% static "img/skills/node-js.png" %}', radius: 16, speed: 0.0007 } // new added
];

const sprites = [];

// Orbits (visible but thin)
skills.forEach(skill => {
  const curve = new THREE.EllipseCurve(
    0, 0,
    skill.radius, skill.radius,
    0, 2 * Math.PI,
    false,
    0
  );

  const points = curve.getPoints(120);
  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const material = new THREE.LineBasicMaterial({
    color: 0x666666,
    opacity: 0.4,
    transparent: true
  });

  const orbit = new THREE.Line(geometry, material);
  orbit.rotation.x = Math.PI / 2;
  scene.add(orbit);

  // bigger icons
  textureLoader.load(skill.src, (texture) => {
    const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
    const sprite = new THREE.Sprite(spriteMat);

    sprite.scale.set(1.6, 1.6, 1.6); // bigger than before

    sprite.userData = {
      angle: Math.random() * Math.PI * 2,
      radius: skill.radius,
      speed: skill.speed
    };

    scene.add(sprite);
    sprites.push(sprite);
  });
});

// Animate
function animate() {
  requestAnimationFrame(animate);

  // Sun flame & light
  if (sun) {
    sun.rotation.y += 0.0015;
    sunLight.position.copy(sun.position);
  }

  // floating stars
  stars.forEach(star => {
    star.position.y += Math.sin(Date.now() * 0.001 + star.position.x) * 0.02;
  });

  // comets
  comets.forEach((comet, index) => {
    comet.position.add(comet.userData.velocity);

    const tail = comet.userData.tail;
    tail.geometry.setFromPoints([
      comet.position.clone(),
      comet.position.clone().add(comet.userData.velocity.clone().multiplyScalar(-8))
    ]);

    if (comet.position.y < -40) {
      scene.remove(comet);
      scene.remove(tail);
      comets.splice(index, 1);
    }
  });

  scene.rotation.y += 0.00025;
  controls.update();

  const t = Date.now() * 0.001;

  sprites.forEach(sprite => {
    const a = sprite.userData.angle + t * sprite.userData.speed * 100;
    const r = sprite.userData.radius;

    sprite.position.set(
      Math.cos(a) * r,
      Math.sin(a * 0.7) * 0.5,
      Math.sin(a) * r
    );

    sprite.lookAt(camera.position);
  });

  renderer.render(scene, camera);
}

animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
